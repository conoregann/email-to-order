<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191b" />
    <script>
      (() => {
        let theme = 'dark'
        try {
          const saved = localStorage.getItem('email-to-order-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch { /* Use the default theme when storage is unavailable. */ }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#17191b' : '#f4f4ef'
      })()
    </script>
    <title>Email to Order</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
